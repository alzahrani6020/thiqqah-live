<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>Test Firebase</title></head>
<body style="font-family:system-ui;padding:40px;text-align:center;">
  <h2>🔥 اختبار Firebase</h2>
  <button onclick="checkConnection()" style="padding:16px 32px;font-size:18px;cursor:pointer;">🔌 فحص الاتصال</button>
  <p id="result" style="margin-top:20px;font-weight:700;"></p>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="lib/firebase-config.js"></script>
  <script>
    function checkConnection() {
      var r = document.getElementById('result');
      if (typeof firebase === 'undefined') { r.textContent = '❌ firebase غير محمل'; return; }
      if (!db) { r.textContent = '❌ db غير جاهز'; return; }
      r.textContent = '⏳ جاري الفحص...';
      // Try a harmless read to verify Firestore is reachable
      db.collection('documents').limit(1).get()
        .then(function() {
          r.textContent = '✅ Firestore متصل. (الكتابة تتطلب تسجيل دخول)';
        })
        .catch(function(err) {
          r.textContent = '❌ خطأ: ' + err.message;
        });
    }
  </script>
</body>
</html>
